server:
  port: 8080

spring:
  application:
    name: talos-server
  # H2 文件模式：数据落盘到 ./data/talosdb.mv.db，重启不丢
  datasource:
    url: jdbc:h2:file:./data/talosdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: talos
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 客户端反向长连接端口（gRPC）
grpc:
  server:
    port: 9443

talos:
  # 服务端 LLM：准入判定 / 项目分拣 / 通用 QA（可走公网）
  llm:
    provider: qwen                 # qwen | zhipu | private
    api-key: ${TALOS_LLM_KEY:}
    model: qwen-max
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 私有化推理：涉及代码的场景强制走内网
  private-model:
    enabled: true
    base-url: http://codebuddy.internal/v1
    model: cb-internal
  security:
    # 任务下发 HMAC 签名密钥，客户端校验指令来源
    task-sign-secret: ${TALOS_SIGN_SECRET:talos-dev-secret}
  client:
    heartbeat-timeout-seconds: 30

logging:
  level:
    com.wind.talos: INFO
