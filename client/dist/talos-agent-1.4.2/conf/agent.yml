# Talos Agent client config - generated by scripts/install.bat
# Field reference: docs\Talos_client_guide.txt
# Edit this file and restart the agent to apply changes.

server:
  addr: localhost
  port: 9443
  # HTTP port of the console, used to download upgrade packages
  httpPort: 8080

client:
  id: 老杨的T14P
  token: 
  workspace: 'D:/develop/project/github/Talos/client/dist/talos-agent-1.4.2/workspace'
  heartbeatSeconds: 10
  signSecret: ""
  # set to false to refuse remote silent upgrades on this machine
  allowUpgrade: true

agents:
  - backend: claude
    enabled: true
    model: claude-opus-4
    cmd: claude
    args: []
  - backend: cursor
    enabled: true
    model: cursor-pro
    cmd: cursor
    args: []
  - backend: codex
    enabled: false
    model: codex-1
    cmd: codex
    args: []
  - backend: codebuddy
    enabled: true
    model: cb-internal
    cmd: codebuddy
    args: []

log:
  dir: logs
