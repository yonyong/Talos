# ============================================================
#  Talos Server - nginx 反向代理配置模板
#
#  安装位置建议：/etc/nginx/conf.d/talos.conf
#
#    cp nginx/talos.conf /etc/nginx/conf.d/
#    vi /etc/nginx/conf.d/talos.conf     # 改 server_name 与证书路径
#    nginx -t && systemctl reload nginx
#
#  ------------------------------------------------------------
#  ⚠️ 动手前先看这三条，都是会直接白屏 / 报错的坑
#  ------------------------------------------------------------
#
#  1) 只能挂在「独立域名 + 根路径」下，不能挂 /talos/ 这类子路径。
#     平台前端在构建期就把引用写成了绝对路径：API 基址是 /api，
#     页面资源是 /assets/xxx.js、/favicon.svg。挂到 /talos/ 下，
#     浏览器会去请求 /api 和 /assets 而不是 /talos/api，全部 404，
#     页面直接白屏。要和别的应用共用，请用「独立域名」或
#     「独立端口」区分，别用路径前缀。
#
#  2) client_max_body_size 必须放大。控制台上传 agent 安装包、
#     Issue 附件，服务端上限是 1GB；nginx 默认只有 1MB，不改
#     会在 nginx 层就被 413 挡掉（请求根本到不了后端，后端日志
#     里什么都看不到，很容易误判成前端 bug）。本模板已设为 1024m。
#
#  3) 读超时别用 60s。准入判定、项目分拣是「录入即判」，同步调用
#     大模型，单次 60 秒以上很常见。沿用 60s 会在模型返回之前
#     先抛 504，而后端其实还在跑。本模板给了 600s。
#
#  gRPC（客户端 9443）默认不用经过 nginx，直接在服务端暴露即可，
#  需要统一入口时才启用文件末尾的注释段落。
# ============================================================


# ------------------------------------------------------------
#  后端：控制台 + REST + 内嵌前端，同源（Spring Boot 默认 8080）
#  keepalive 让 nginx 复用与后端的连接，省掉每个请求的 TCP 握手
# ------------------------------------------------------------
upstream talos_console {
    server 127.0.0.1:8080;
    keepalive 32;
}


# ------------------------------------------------------------
#  HTTP -> HTTPS 跳转
#  只跑 http 的话，删掉这个 server 块，并把下面 443 那段的
#  "ssl http2" 改成 "http2"（nginx 1.25.1+ 写 "http2 on;"）
# ------------------------------------------------------------
server {
    listen      80;
    server_name talos.yourdomain.com;          # <-- 改成你的域名

    return 301 https://$host$request_uri;
}


server {
    # nginx >= 1.25.1 的写法是：  listen 443 ssl;  http2 on;
    listen      443 ssl http2;                 # 老版本（CentOS 7/8 自带）用这个
    server_name talos.yourdomain.com;          # <-- 改成你的域名

    # ---- 证书 ----
    ssl_certificate     /etc/nginx/ssl/talos.crt;   # <-- 改成实际路径
    ssl_certificate_key /etc/nginx/ssl/talos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/talos.access.log;
    error_log  /var/log/nginx/talos.error.log;

    # ---- 上传体积：与服务端 multipart 的 1GB 对齐 ----
    client_max_body_size 1024m;
    client_body_timeout  300s;

    # ---- 整站反代：SPA + /api + 附件下载 ----
    location / {
        proxy_pass http://talos_console;

        # 要吃到 upstream keepalive，必须 HTTP/1.1 且显式清空 Connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 传递原始请求头，否则后端拿不到真实域名 / 客户端 IP。
        # Spring Boot 默认会解析这些头（Tomcat RemoteIpValve 认 127.0.0.1）。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 1GB 上传：不缓冲请求体，边收边转给后端。
        # 默认行为是 nginx 先把整个 body 落到 proxy_temp 再转发 ——
        # 1GB 的安装包会先写一遍磁盘，慢一倍还占双份空间。
        proxy_request_buffering off;
        # 下载同理：大文件直通，不在 nginx 上多缓冲一道
        proxy_buffering off;

        # 准入判定 / 分拣同步等大模型，600s 给足余量
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---- 前端静态资源：Vite 产物带内容 hash，可放心长缓存 ----
    location ~ ^/assets/ {
        proxy_pass http://talos_console;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # ---- H2 控制台 ----
    # 生产必须关闭（config/application.yml 里 TALOS_H2_CONSOLE 默认 false）。
    # 万一临时开启排障，也只放内网，绝不能对公网开口子 ——
    # 它能直接读写整个数据库。
    location /h2-console/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://talos_console;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
}


# ============================================================
#  可选：客户端 gRPC 也走 nginx（默认不用配）
#
#  什么时候需要：只允许开一个对外端口、或客户端与服务端之间必须
#  走统一入口时。直连最简单，也少一层故障点，能用直连就别配这段。
#
#  ⚠️ 必须「明文 + 独立端口」，不能复用 443：
#     Talos agent 建通道用的是 usePlaintext()，即明文 HTTP/2（h2c），
#     不带 TLS。把它指到 443 上会立刻握手失败，客户端表现为反复
#     重连、日志里一行 UNAVAILABLE —— 这个坑很隐蔽，因为 nginx 侧
#     看不到任何错误请求。
#
#  启用步骤：
#    1) 服务端 gRPC 挪到内网端口，避免和下面 listen 的端口撞车：
#         config/env.sh:   export TALOS_GRPC_PORT=19443
#       更保险的是顺手只监听本机（config/application.yml）：
#         grpc:
#           server:
#             address: 127.0.0.1
#    2) 解开下面的注释
#    3) 客户端 conf/agent.yml 不用改：addr 填域名/IP，port 仍是 9443
# ============================================================
#
# upstream talos_grpc {
#     server 127.0.0.1:19443;
# }
#
# server {
#     # nginx >= 1.25.1 的写法是：  listen 9443;  http2 on;
#     listen      9443 http2;
#     server_name talos.yourdomain.com;
#
#     access_log /var/log/nginx/talos.grpc.log;
#     error_log  /var/log/nginx/talos.grpc.error.log;
#
#     location / {
#         grpc_pass grpc://talos_grpc;
#         grpc_set_header Host      $host;
#         grpc_set_header X-Real-IP $remote_addr;
#
#         # 双向流是常驻长连接，空闲超时给足。
#         # 客户端每 30s 发一次 keepAlive ping 续命，正常不会触发超时。
#         grpc_read_timeout    3600s;
#         grpc_send_timeout    3600s;
#         grpc_socket_keepalive on;
#     }
# }
